[package]
name = "is-net"
description = "InputShare networking: peer discovery, authenticated encrypted transport, reconnection and workspace sync."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
is-core = { path = "../is-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
rand.workspace = true
uuid.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros"] }
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"

[[example]]
name = "netcheck"
required-features = []

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
