[workspace]
resolver = "2"
members = [
    "crates/is-core",
    "crates/is-net",
    "crates/is-input",
    "crates/is-agent",
    "crates/is-cli",
    "crates/is-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
directories = "5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
tracing = "0.1"
